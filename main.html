<style>
  .fixed-ctrl {
		position: fixed;
		right: 0;
		left: 0;
		height: 150px;
		bottom: 0px;
		opacity: 0;
		visibility: hidden;
		transition: opacity 0.3s ease, visibility 0.3s ease;
		pointer-events: none;
  }

  .fixed-ctrl.show {
		opacity: 1;
		visibility: visible;
  }
  .fixed-box{
	width: 100%;
	max-width: 1054px;
	margin: 0 auto; 
	position: relative;
  }
  .left-box,
  .right-box {
		position: absolute;
		opacity: 0;
		transform: translateY(0);
		transition: opacity 0.6s ease, transform 0.6s ease;
		pointer-events: auto;
  }

  .left-box img, .right-box img{
	width: auto;
	height: 150px;
  }
  .img_pc img {
		width: 83%;
		display: block;
		margin: 0 auto;
  }

  @media screen and (max-width: 767px) {
		.fixed-ctrl{
			height: 80px;
			bottom: 50px;
		}
		.left-box img, .right-box img{
			height: 80px;
		}
	}

  .left-box {
    	transform: translateX(-50px);
  }

  .right-box {
    	transform: translateX(50px);
  }

  .show .left-box {
		opacity: 1;
		transform: translateX(0);
  }

  .show .right-box {
		opacity: 1;
		transform: translateX(0);
  }
</style>
